# StudyVault local development stack.
# Docker is OPTIONAL for local development (a portable PostgreSQL setup is
# documented in README.md), but this compose file mirrors production topology.
# Production secrets are NEVER baked into images - all config is env-injected.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: studyvault
      POSTGRES_USER: studyvault
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-studyvault_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyvault -d studyvault"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible private object storage for local development.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/studyvault
      DATABASE_USERNAME: studyvault
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-studyvault_dev}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
      APP_FRONTEND_URL: http://localhost:3000
      APP_COOKIE_SECURE: "false"
      STORAGE_PROVIDER: s3
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_S3_BUCKET: studyvault-local
      AWS_S3_ENDPOINT: http://minio:9000
      EMAIL_PROVIDER: log
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-razorpay}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
  miniodata:
