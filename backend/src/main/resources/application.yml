spring:
  application:
    name: studyvault-api
  profiles:
    default: dev

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 8000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  servlet:
    multipart:
      max-file-size: 210MB
      max-request-size: 230MB

  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080
  error:
    whitelabel:
      enabled: false
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  forward-headers-strategy: framework
  compression:
    enabled: true
  max-http-request-header-size: 16KB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    mail:
      enabled: false

logging:
  pattern:
    console: "%d{ISO8601} %-5level [%X{reqId:-system}] %logger{36} - %msg%n"
  level:
    root: INFO

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  cookie:
    session-name: sv_session
    csrf-name: sv_csrf
    secure: ${APP_COOKIE_SECURE:false}
    domain: ${APP_COOKIE_DOMAIN:}
  session:
    ttl-days: 7
    max-lifetime-days: 30
    slide-after-hours: 12
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local-dir: ${LOCAL_STORAGE_DIR:./data/storage}
    presign-ttl-minutes: 5
    s3:
      bucket: ${AWS_S3_BUCKET:}
      region: ${AWS_REGION:ap-south-1}
      endpoint: ${AWS_S3_ENDPOINT:}
      path-style-access: ${AWS_S3_PATH_STYLE:false}
  email:
    provider: ${EMAIL_PROVIDER:log}
    from: ${EMAIL_FROM:no-reply@studyvault.local}
  payments:
    provider: ${PAYMENT_PROVIDER:razorpay}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  bootstrap-admin:
    enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
    email: ${ADMIN_BOOTSTRAP_EMAIL:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
